<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиум-заказ карты «Тройка»</title>
    <!-- Подключаем красивый шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003399;
            --primary-light: #e6f0fa;
            --accent: #ff3333;
            --accent-hover: #e02e2e;
            --bg-gradient: linear-gradient(135deg, #003399 0%, #001a4d 100%);
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --border-color: #e2e8f0;
            --tg-color: #229ED9;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .order-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .order-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            background-color: #fafbfc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:hover, select:hover {
            border-color: #cbd5e1;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 51, 153, 0.1);
        }

        .design-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .design-option {
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            background: #fafbfc;
        }

        .design-option input {
            display: none;
        }

        .design-option:hover {
            border-color: var(--primary);
        }

        .design-option.active {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .price-display {
            background: var(--primary-light);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 25px;
            border: 1px dashed rgba(0, 51, 153, 0.3);
        }

        .price-display span {
            font-size: 24px;
            font-weight: 800;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 51, 51, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.6);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Стили для ссылки на Telegram */
        .telegram-footer {
            margin-top: 25px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .telegram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--tg-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .telegram-link:hover {
            opacity: 0.8;
        }

        .telegram-link svg {
            width: 20px;
            height: 20px;
            fill: var(--tg-color);
        }
    </style>
</head>
<body>

    <div class="order-container">
        <div class="header">
            <h2>Карта «Тройка»</h2>
            <p>Выберите срок действия и индивидуальный дизайн</p>
        </div>

        <form id="troikaForm" onsubmit="sendToTelegram(event)">
            
            <div class="form-group">
                <label for="fullName">ФИО получателя</label>
                <input type="text" id="fullName" name="fullName" placeholder="Иванов Иван Иванович" required>
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 000-00-00" required>
            </div>

            <div class="form-group">
                <label>Дизайн карты</label>
                <div class="design-selector">
                    <label class="design-option active" onclick="selectDesign(this)">
                        <input type="radio" name="design" value="Классика" checked> Классика
                    </label>
                    <label class="design-option" onclick="selectDesign(this)">
                        <input type="radio" name="design" value="Метро"> Метро
                    </label>
                    <label class="design-option" onclick="selectDesign(this)">
                        <input type="radio" name="design" value="Cyber"> Cyberpunk
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="duration">Срок подписки</label>
                <select id="duration" name="duration" onchange="updatePrice()">
                    <option value="1 месяц — 1 000 ₽">1 месяц — 1 000 ₽</option>
                    <option value="2 месяца — 2 000 ₽">2 месяца — 2 000 ₽</option>
                    <option value="3 месяца — 3 000 ₽">3 месяца — 3 000 ₽</option>
                    <option value="4 месяца — 4 000 ₽">4 месяца — 4 000 ₽</option>
                    <option value="5 месяцев — 5 000 ₽">5 месяцев — 5 000 ₽</option>
                    <option value="6 месяцев — 6 000 ₽">6 месяцев — 6 000 ₽</option>
                    <option value="7 месяцев — 7 000 ₽">7 месяцев — 7 000 ₽</option>
                    <option value="8 месяцев — 8 000 ₽">8 месяцев — 8 000 ₽</option>
                    <option value="9 месяцев — 9 000 ₽">9 месяцев — 9 000 ₽</option>
                    <option value="10 месяцев — 10 000 ₽">10 месяцев — 10 000 ₽</option>
                    <option value="11 месяцев — 11 000 ₽">11 месяцев — 11 000 ₽</option>
                    <option value="12 месяцев — 12 000 ₽" selected>1 год (12 месяцев) — 12 000 ₽</option>
                </select>
            </div>

            <div class="price-display">
                Итого к оплате: <br><span id="totalPrice">12000</span> ₽
            </div>

            <button type="submit">Отправить заказ в Telegram</button>
        </form>

        <!-- Ссылка на Telegram-канал внизу -->
        <div class="telegram-footer">
            <a href="https://t.me/ismammma" target="_blank" class="telegram-link">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.22-3.55 3.91-1.67 4.72-1.96 5.24-1.97.12 0 .39.03.56.17.14.12.18.28.2.45-.02.07-.02.13-.04.2z"/>
                </svg>
                Наш Telegram-канал
            </a>
        </div>
    </div>

    <script>
        // Функция расчета цены с анимацией
        function updatePrice() {
            const selectElement = document.getElementById('duration');
            const selectedText = selectElement.options[selectElement.selectedIndex].text;
            
            // Вытаскиваем число из текста для расчета
            let months = parseInt(selectedText);
            if (selectedText.includes('год')) months = 12;
            
            const totalPrice = months * 1000;
            
            const priceSpan = document.getElementById('totalPrice');
            priceSpan.innerText = totalPrice.toLocaleString('ru-RU');
            
            priceSpan.style.transform = 'scale(1.1)';
            setTimeout(() => {
                priceSpan.style.transform = 'scale(1)';
            }, 200);
        }

        // Выбор дизайна
        function selectDesign(element) {
            document.querySelectorAll('.design-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            element.querySelector('input').checked = true;
        }

        // Отправка данных анкеты в Telegram
        function sendToTelegram(event) {
            event.preventDefault(); // Предотвращаем перезагрузку страницы

            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const design = document.querySelector('input[name="design"]:checked').value;
            const durationSelect = document.getElementById('duration');
            const duration = durationSelect.options[durationSelect.selectedIndex].text;
            const totalPrice = document.getElementById('totalPrice').innerText;

            // Формируем текст сообщения
            const message = `🎫 Новый заказ карты Тройка!\n\n` +
                            `👤 ФИО: ${fullName}\n` +
                            `📞 Телефон: ${phone}\n` +
                            `🎨 Дизайн: ${design}\n` +
                            `⏳ Срок: ${duration}\n` +
                            `💰 Сумма: ${totalPrice} ₽`;

            // Кодируем текст для URL ссылки
            const encodedMessage = encodeURIComponent(message);

            // Перенаправляем пользователя в Telegram для отправки сообщения (откроется диалог или бот)
            const telegramUrl = `https://t.me/ismammma?text=${encodedMessage}`;
            window.open(telegramUrl, '_blank');
        }

        window.onload = updatePrice;
    </script>

</body>
</html>
