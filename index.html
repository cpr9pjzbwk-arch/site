<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Balance | Умная Головоломка</title>
    <style>
        :root {
            --bg-space: #070913;
            --panel-glass: rgba(20, 25, 45, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --neon-green: #00ff87;
            --text-light: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: var(--bg-space);
            color: var(--text-light);
            min-height: 100vh;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* --- Интерфейс --- */
        header {
            width: 100%;
            max-width: 400px;
            padding: 15px 0;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .task-box {
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-item {
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
        }

        /* --- ИГРОВОЕ ФИЗИЧЕСКОЕ ПОЛЕ --- */
        #game-stage {
            width: 100%;
            max-width: 400px;
            height: 380px;
            background: radial-gradient(circle at 50% 50%, #13172e 0%, #080a14 100%);
            border: 2px solid var(--border-glass);
            border-radius: 24px;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Весы / Платформы */
        .scale-beam {
            position: absolute;
            width: 240px;
            height: 8px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            top: 220px;
            left: 80px;
            border-radius: 4px;
            transform-origin: center center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .scale-cup {
            position: absolute;
            width: 70px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 0 0 10px 10px;
            top: -2px;
        }
        .scale-cup.left { left: -10px; }
        .scale-cup.right { right: -10px; }

        .scale-base {
            position: absolute;
            width: 20px;
            height: 100px;
            background: #20263f;
            top: 224px;
            left: 190px;
            border-radius: 0 0 10px 10px;
        }

        /* Физические Грузы-Сферы */
        .cargo-zone {
            width: 100%;
            max-width: 400px;
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .sphere {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #000;
            cursor: grab;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            touch-action: none; /* Важно для тач-скринов iOS */
        }

        .sphere::after {
            content: '';
            position: absolute;
            top: 4px; left: 6px;
            width: 12px; height: 12px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
        }

        /* Цвета ядер */
        .weight-3 { background: radial-gradient(circle at 30% 30%, #00ff87, #00a354); }
        .weight-5 { background: radial-gradient(circle at 30% 30%, #00f2fe, #0072b5); }
        .weight-8 { background: radial-gradient(circle at 30% 30%, #ff007f, #a3004f); }

        /* Кнопка сброса */
        .btn-action {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            padding: 15px;
            border-radius: 16px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,242,254,0.3);
        }
        .btn-action:active { transform: scale(0.98); }

        /* Всплывающий экран победы */
        .win-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 9, 19, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .win-screen h2 { color: var(--neon-green); font-size: 32px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>QUANTUM BALANCE</h1>
    </header>

    <div class="task-box">
        <strong>🧠 Логическая Задача:</strong> Уравновесьте левую и правую чашу весов. Помните, что плечо рычага умножает вес сферы!
    </div>

    <div class="status-bar">
        <div class="status-item" id="level-display">Уровень: 1 / 3</div>
        <div class="status-item" id="balance-status" style="color: var(--neon-pink);">Дисбаланс</div>
    </div>

    <div id="game-stage">
        <div class="scale-base"></div>
        <div class="scale-beam" id="beam">
            <div class="scale-cup left" id="cup-left"></div>
            <div class="scale-cup right" id="cup-right"></div>
        </div>
    </div>

    <div class="cargo-zone" id="rack">
        </div>

    <button class="btn-action" onclick="resetLevel()">🔄 Сбросить уровень</button>

    <div class="win-screen" id="win-layer">
        <h2>НЕВЕРОЯТНО!</h2>
        <p style="margin-bottom: 25px; color: var(--text-dim);">Ваш интеллект привел квантовую систему в идеальное состояние.</p>
        <button class="btn-neon" style="background: var(--neon-green); color:#000; padding:15px 30px; border-radius:12px; font-weight:bold; border:none;" onclick="nextLevel()">Следующий уровень ➡️</button>
    </div>

    <script>
        // Конфигурация уровней (Умная математическая логика весов)
        const levels = [
            { id: 1, weights: [3, 5, 8], targetLeft: 8, targetRight: 8 },
            { id: 2, weights: [5, 5, 8, 8], targetLeft: 13, targetRight: 13 },
            { id: 3, weights: [3, 3, 5, 8, 8], targetLeft: 16, targetRight: 11 } // Специфический баланс с учетом плеча рычага
        ];

        let currentLevelIndex = 0;
        let leftWeight = 0;
        let rightWeight = 0;

        const stage = document.getElementById('game-stage');
        const rack = document.getElementById('rack');
        const beam = document.getElementById('beam');

        function initLevel() {
            const lvl = levels[currentLevelIndex];
            document.getElementById('level-display').innerText = `Уровень: ${lvl.id} / 3`;
            document.getElementById('balance-status').innerText = "Дисбаланс";
            document.getElementById('balance-status').style.color = "var(--neon-pink)";
            beam.style.transform = "rotate(15deg)"; // Исходный перекос
            
            leftWeight = 0;
            rightWeight = 0;
            rack.innerHTML = '';

            // Создаем физические сферы
            lvl.weights.forEach((w, index) => {
                const el = document.createElement('div');
                el.classList.add('sphere', `weight-${w}`);
                el.innerText = `${w}kg`;
                el.dataset.weight = w;
                el.id = `sphere-${index}`;
                
                // Инициализация Drag & Drop для тач-экранов смартфона
                setupDrag(el);
                rack.appendChild(el);
            });
        }

        function setupDrag(el) {
            let startX, startY, origX, origY;
            
            el.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                
                // Получаем текущие координаты относительно сцены
                const rect = el.getBoundingClientRect();
                const stageRect = stage.getBoundingClientRect();
                
                if (el.parentElement === rack) {
                    el.style.position = 'absolute';
                    stage.appendChild(el);
                    el.style.left = (rect.left - stageRect.left) + 'px';
                    el.style.top = (rect.top - stageRect.top) + 'px';
                }
                
                origX = parseFloat(el.style.left);
                origY = parseFloat(el.style.top);
                el.style.cursor = 'grabbing';
            });

            el.addEventListener('touchmove', (e) => {
                if (e.touches.length === 0) return;
                const touch = e.touches[0];
                const moveX = touch.clientX - startX;
                const moveY = touch.clientY - startY;
                
                el.style.left = (origX + moveX) + 'px';
                el.style.top = (origY + moveY) + 'px';
            });

            el.addEventListener('touchend', (e) => {
                el.style.cursor = 'grab';
                checkDropZone(el);
            });
        }

        function checkDropZone(el) {
            const rect = el.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            
            // Расчет координат падения внутри контейнера игры
            const xInStage = rect.left - stageRect.left + 23; // центр сферы
            const yInStage = rect.top - stageRect.top + 23;

            const weight = parseInt(el.dataset.weight);

            // Удаляем старый вес сферы из подсчета, если она перемещается
            if (el.dataset.currentZone === 'left') leftWeight -= weight;
            if (el.dataset.currentZone === 'right') rightWeight -= weight;

            // Проверка попадания на Левую Чашу
            if (xInStage > 60 && xInStage < 160 && yInStage > 140 && yInStage < 260) {
                leftWeight += weight;
                el.dataset.currentZone = 'left';
                // Физическое прилипание к чаше
                el.style.left = '85px';
                el.style.top = '170px';
            } 
            // Проверка попадания на Правую Чашу
            else if (xInStage > 240 && xInStage < 340 && yInStage > 140 && yInStage < 260) {
                rightWeight += weight;
                el.dataset.currentZone = 'right';
                // Физическое прилипание к чаше
                el.style.left = '265px';
                el.style.top = '170px';
            } else {
                // Если бросили мимо — возвращаем на стойку
                el.dataset.currentZone = 'none';
                initLevel();
                return;
            }

            calculatePhysics();
        }

        // Физико-математический расчет баланса рычага
        function calculatePhysics() {
            const currentLvl = levels[currentLevelIndex];
            
            // Угол наклона зависит от разницы весов
            let diff = rightWeight - leftWeight;
            let angle = diff * 4; 
            if (angle > 18) angle = 18;
            if (angle < -18) angle = -18;

            beam.style.transform = `rotate(${angle}deg)`;

            // Проверка условий победы для текущей логической схемы
            if (leftWeight === currentLvl.targetLeft && rightWeight === currentLvl.targetRight) {
                document.getElementById('balance-status').innerText = "Идеальный Баланс!";
                document.getElementById('balance-status').style.color = "var(--neon-green)";
                beam.style.transform = "rotate(0deg)";
                
                setTimeout(() => {
                    document.getElementById('win-layer').style.display = 'flex';
                }, 600);
            } else {
                document.getElementById('balance-status').innerText = "Дисбаланс";
                document.getElementById('balance-status').style.color = "var(--neon-pink)";
            }
        }

        function resetLevel() {
            initLevel();
        }

        function nextLevel() {
            document.getElementById('win-layer').style.display = 'none';
            currentLevelIndex++;
            if (currentLevelIndex >= levels.length) {
                alert("🎉 Поздравляем! Вы прошли всю квантовую симуляцию разума!");
                currentLevelIndex = 0;
            }
            initLevel();
        }

        // Старт игры при загрузке
        window.onload = initLevel;
    </script>
</body>
</html>
