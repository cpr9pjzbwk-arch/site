<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NexusMobile - Игровой Портал</title>
    <style>
        /* --- Базовые Установки и Мобильная Оптимизация --- */
        :root {
            --bg-dark: #0b0d17;
            --panel-glass: rgba(22, 28, 45, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00f2fe;
            --neon-purple: #4facfe;
            --neon-green: #00ff87;
            --text-light: #f1f5f9;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* Убирает синий блик при нажатии на iPhone */
        }

        body {
            background: #06070d;
            color: var(--text-light);
            min-height: 100vh;
            /* Учет челки и вырезов на iPhone */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            overflow-x: hidden;
        }

        /* Анимация переключения страниц */
        .page {
            display: none;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            padding: 15px;
        }

        .page.active {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        /* --- СТИЛЬНЫЕ МОБИЛЬНЫЕ КНОПКИ --- */
        .btn-neon {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: white;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: block;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .btn-neon:active {
            transform: scale(0.96); /* Эффект нажатия пальцем */
            filter: brightness(1.2);
        }

        .glass-panel {
            background: var(--panel-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* --- СТРАНИЦА 1: МОБИЛЬНЫЙ ХАБ --- */
        header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: rgba(11, 13, 23, 0.95);
            border-bottom: 1px solid var(--border-glass);
            text-align: center;
        }

        .logo-area {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(90deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Адаптивная мобильная сетка */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            -webkit-appearance: none; /* Убирает дефолтный стиль iOS */
        }

        /* Карточки под большой палец */
        .game-card {
            border-radius: 24px;
            height: 320px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-size: cover;
            background-position: center;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-overlay {
            background: linear-gradient(to top, #0b0d17 0%, rgba(11,13,23,0.6) 70%, transparent 100%);
            padding: 20px;
        }

        .card-overlay h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .torrent-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--neon-green);
            margin-bottom: 15px;
        }

        /* --- СТРАНИЦА 2: МОБИЛЬНАЯ ПАНЕЛЬ ПМ --- */
        .canvas-area {
            height: 300px;
            background: #0f121d;
            border: 2px solid var(--neon-cyan);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .grid-lines {
            position: absolute;
            width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 15px 15px;
        }

        .mobile-tools {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn:active {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--neon-cyan);
        }

        /* Всплывающее iOS-like уведомление */
        .toast {
            position: fixed;
            top: 20px;
            left: 5%;
            width: 90%;
            background: rgba(0, 255, 135, 0.95);
            backdrop-filter: blur(10px);
            color: #000;
            padding: 16px;
            border-radius: 16px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,255,135,0.3);
            display: none;
            z-index: 10000;
            animation: slideDown 0.3s ease forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">📱 Объект интегрирован в мобильное ядро!</div>

    <div id="page1" class="page active">
        <header class="glass-panel">
            <div class="logo-area">NEXUS.TORN.MOBILE</div>
            <button class="btn-neon" onclick="switchPage('page2')">⚙️ Конструктор ПМ / Темы</button>
        </header>

        <div class="main-layout">
            <div class="glass-panel">
                <div class="setting-item">
                    <label>Мобильный Трекер Скорости</label>
                    <select>
                        <option>Ультра Торрент-Трафик (Torn)</option>
                        <option>Прокси-Сервер HTTP3 (iOS Pro)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Архитектура Хэша</label>
                    <select>
                        <option>ARM64 Оптимизация</option>
                        <option>Многопоточный CRC32</option>
                    </select>
                </div>
            </div>

            <div class="glass-panel" style="padding: 12px;">
                <input type="text" placeholder="Поиск кода игры для iPhone...">
            </div>

            <div class="game-card" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400');">
                <div class="card-overlay">
                    <h3>Cyber-Torn Mobile</h3>
                    <div class="torrent-meta">
                        <span>⚡ 14.8k сидов</span>
                        <span>📦 12.4 Гб</span>
                    </div>
                    <button class="btn-neon" onclick="downloadGame('Cyber-Torn Mobile')">СКАЧАТЬ TORN</button>
                </div>
            </div>

            <div class="game-card" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=400');">
                <div class="card-overlay">
                    <h3>Shadow Blade RPG</h3>
                    <div class="torrent-meta">
                        <span>⚡ 9.1k сидов</span>
                        <span>📦 4.5 Гб</span>
                    </div>
                    <button class="btn-neon" onclick="downloadGame('Shadow Blade')">СКАЧАТЬ TORN</button>
                </div>
            </div>
        </div>
    </div>


    <div id="page2" class="page">
        <div class="glass-panel" style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
            <span style="font-weight: 800; font-size: 14px; color: var(--neon-cyan);" id="game-target">РЕНДЕРИНГ ЯДРА ПМ</span>
            <button class="btn-neon" style="width: auto; padding: 10px 15px; background: #ff4757;" onclick="switchPage('page1')">Назад ↩</button>
        </div>

        <div class="canvas-area" id="canvas">
            <div class="grid-lines"></div>
            <div id="canvas-status" style="position: absolute; width:100%; top:40%; text-align:center; font-size:13px; color:var(--text-dim); padding:10px;">
                Нажимайте кнопки ниже, чтобы добавлять элементы на холст смартфона
            </div>
        </div>

        <div class="glass-panel">
            <h4 style="margin-bottom: 12px; font-size: 14px; text-transform: uppercase;">Добавить модули постройки:</h4>
            <div class="mobile-tools">
                <button class="tool-btn" onclick="addMobileNode('📱 iOS Пакет')"><span>📱</span> iOS Пакет</button>
                <button class="tool-btn" onclick="addMobileNode('🚀 Torn Скрипт')"><span>🚀</span> Torn Код</button>
                <button class="tool-btn" onclick="addMobileNode('🎨 Светлая Тема')"><span>🎨</span> Светлый UI</button>
                <button class="tool-btn" onclick="addMobileNode('🛡️ Шифр Протокола')"><span>🛡️</span> Защита</button>
            </div>
        </div>

        <div class="glass-panel">
            <button class="btn-neon" style="background: var(--neon-green); color: #000;" onclick="triggerToast('Настройки мобильной конфигурации сохранены!')">СОХРАНИТЬ СБОРКУ</button>
        </div>
    </div>

    <script>
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadGame(name) {
            document.getElementById('game-target').innerText = `СБОРКА ДЛЯ: ${name.toUpperCase()}`;
            switchPage('page2');
            triggerToast(`Подключение к Torn-трекеру для ${name}...`);
        }

        function addMobileNode(text) {
            const canvas = document.getElementById('canvas');
            const status = document.getElementById('canvas-status');
            if (status) status.style.display = 'none';

            const item = document.createElement('div');
            item.style.position = 'absolute';
            item.style.padding = '8px 12px';
            item.style.background = 'rgba(0, 242, 254, 0.25)';
            item.style.border = '1px solid var(--neon-cyan)';
            item.style.borderRadius = '10px';
            item.style.fontSize = '12px';
            item.style.color = '#fff';
            item.style.left = Math.random() * (canvas.offsetWidth - 120) + 'px';
            item.style.top = Math.random() * (canvas.offsetHeight - 40) + 'px';
            item.innerText = text;

            // Удаление тапом
            item.onclick = function() { this.remove(); };

            canvas.appendChild(item);
            triggerToast(`Добавлен: ${text}`);
        }

        function triggerToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
