<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Impulse | Адекватная Версия</title>
    <style>
        :root {
            --bg: #060913;
            --panel: rgba(18, 22, 41, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --neon-cyan: #00f2fe;
            --neon-magenta: #f355da;
            --neon-gold: #ffb300;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg); color: #fff; min-height: 100vh;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
            display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }

        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; height: 92vh; }
        .screen.active { display: flex; }

        header { padding: 15px 0; text-align: center; }
        h1 { font-size: 26px; font-weight: 900; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .glass { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .lvl-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; 
            padding: 15px 10px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .lvl-btn:active { transform: scale(0.95); }
        
        .medal-badge { font-size: 20px; }

        .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        .hud-item { background: rgba(255,255,255,0.05); padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); }
        
        #canvas-container { position: relative; width: 100%; aspect-ratio: 9/13; max-height: 65vh; border-radius: 24px; overflow: hidden; border: 2px solid var(--border); }
        canvas { width: 100%; height: 100%; background: #0b0f19; display: block; }

        .btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe); border: none; color: white;
            padding: 15px; border-radius: 16px; font-weight: 700; font-size: 16px; text-align: center; cursor: pointer; margin-top: 10px;
        }

        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6,9,19,0.95); 
            z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .big-medal { font-size: 80px; margin: 20px 0; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <header>
            <h1>QUANTUM IMPULSE</h1>
            <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Исправленная комфортная версия</p>
        </header>
        <div class="glass" style="flex: 1; display:flex; flex-direction:column; justify-content: space-between;">
            <div>
                <h3 style="font-size: 15px; color: var(--neon-cyan); text-transform: uppercase;">Выберите уровень:</h3>
                <div class="level-grid" id="levels-wrapper"></div>
            </div>
            <div style="font-size: 13px; color:#8ba2cc; text-align:center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px;">
                🎯 <b>Новое управление:</b> Зажмите пальцем белый шар, потяните назад (как рогатку) и отпустите, чтобы запустить его!
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="hud">
            <button onclick="exitToMenu()" style="background:none; border:none; color:var(--neon-magenta); font-weight:bold; font-size: 16px;">⬅ Выйти</button>
            <div class="hud-item" id="hud-level">Уровень: 1</div>
            <div class="hud-item" id="hud-time">Время: 0.0с</div>
        </div>
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <button class="btn" style="background: #202744; border: 1px solid var(--border);" onclick="restartCurrentLevel()">🔄 Сбросить уровень</button>
    </div>

    <div class="modal" id="win-modal">
        <h2>УРОВЕНЬ ПРОЙДЕН!</h2>
        <p id="win-time-desc">Вы справились за 0.0 сек.</p>
        <div class="big-medal" id="win-medal-icon">🥇</div>
        <h3 id="win-medal-name" style="color: var(--neon-gold); margin-bottom: 30px;">ЗОЛОТО</h3>
        <button class="btn" style="width: 80%;" onclick="exitToMenu()">Отлично</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = 450;
        const HEIGHT = 650;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let levelProgress = {
            1: { medal: '', bestTime: null, gold: 6, silver: 15 },
            2: { medal: '', bestTime: null, gold: 10, silver: 20 },
            3: { medal: '', bestTime: null, gold: 12, silver: 25 },
            4: { medal: '', bestTime: null, gold: 15, silver: 30 },
            5: { medal: '', bestTime: null, gold: 18, silver: 35 }
        };

        let currentLevel = 1;
        let gameActive = false;
        let startTime = 0;
        let timerInterval;

        // Физика стала мягкой и послушной
        let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 16 };
        const GRAVITY = 0.09; // Уменьшил в 2 раза, шар парит плавно
        const FRICTION = 0.96; // Повысил торможение, шар сам останавливается

        // Для управления рогаткой
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        let platforms = [];
        let hazards = []; 
        let portal = { x: 0, y: 0, radius: 35 }; // Увеличил портал, чтобы легче попадать

        function loadLevelData(lvlNum) {
            platforms = []; hazards = [];
            
            // Стены
            platforms.push({x: 0, y: HEIGHT - 15, w: WIDTH, h: 15, type: 'normal'});
            platforms.push({x: 0, y: 0, w: 15, h: HEIGHT, type: 'normal'});
            platforms.push({x: WIDTH - 15, y: 0, w: 15, h: HEIGHT, type: 'normal'});
            platforms.push({x: 0, y: 0, w: WIDTH, h: 15, type: 'normal'});

            if (lvlNum === 1) {
                player.x = 70; player.y = 550; portal.x = 370; portal.y = 120;
                platforms.push({x: 15, y: 400, w: 220, h: 20, type: 'normal'});
                platforms.push({x: 200, y: 250, w: 240, h: 20, type: 'normal'});
            } else if (lvlNum === 2) {
                player.x = 70; player.y = 580; portal.x = 370; portal.y = 100;
                platforms.push({x: 15, y: 450, w: 260, h: 20, type: 'normal'});
                platforms.push({x: 150, y: 280, w: 290, h: 20, type: 'normal'});
                hazards.push({x: 180, y: 435, w: 30, h: 15}); // Маленький лазер
            } else if (lvlNum === 3) {
                player.x = 225; player.y = 580; portal.x = 225; portal.y = 100;
                platforms.push({x: 80, y: 420, w: 290, h: 20, type: 'bouncy'}); // Прыгучая
                hazards.push({x: 190, y: 405, w: 70, h: 15});
            } else if (lvlNum === 4) {
                player.x = 70; player.y = 100; portal.x = 370; portal.y = 550;
                platforms.push({x: 15, y: 220, w: 300, h: 20, type: 'normal'});
                platforms.push({x: 130, y: 400, w: 310, h: 20, type: 'normal'});
            } else if (lvlNum === 5) {
                player.x = 70; player.y = 580; portal.x = 370; portal.y = 550;
                platforms.push({x: 15, y: 350, w: 420, h: 20, type: 'normal'});
                portal.x = 225; portal.y = 120;
            }
        }

        function buildMenu() {
            const container = document.getElementById('levels-wrapper');
            container.innerHTML = '';
            Object.keys(levelProgress).forEach(id => {
                const lvl = levelProgress[id];
                const btn = document.createElement('button');
                btn.className = 'lvl-btn';
                let medalIcon = lvl.medal === 'gold' ? '🥇' : lvl.medal === 'silver' ? '🥈' : lvl.medal === 'bronze' ? '🥉' : '⚪';
                btn.innerHTML = `<span>Уровень ${id}</span><span class="medal-badge">${medalIcon}</span>`;
                btn.onclick = () => startLevel(parseInt(id));
                container.appendChild(btn);
            });
        }

        function startLevel(num) {
            currentLevel = num;
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('hud-level').innerText = `Уровень: ${num}`;
            loadLevelData(num);
            player.vx = 0; player.vy = 0;
            startTime = Date.now();
            gameActive = true;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('hud-time').innerText = `Время: ${elapsed}с`;
            }, 100);

            requestAnimationFrame(updatePhysics);
        }

        function updatePhysics() {
            if(!gameActive) return;

            if (!isDragging) {
                player.vy += GRAVITY;
                player.vx *= FRICTION;
                player.vy *= FRICTION;
                player.x += player.vx;
                player.y += player.vy;
            }

            // Столкновения с платформами
            platforms.forEach(p => {
                let closestX = Math.max(p.x, Math.min(player.x, p.x + p.w));
                let closestY = Math.max(p.y, Math.min(player.y, p.y + p.h));
                let dx = player.x - closestX;
                let dy = player.y - closestY;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < player.radius) {
                    let overlap = player.radius - dist;
                    if (dist === 0) { dx = 0; dy = -1; dist = 1; }
                    player.x += (dx / dist) * overlap;
                    player.y += (dy / dist) * overlap;

                    let nx = dx / dist;
                    let ny = dy / dist;
                    let bounce = p.type === 'bouncy' ? 1.3 : 0.4; // Мягкий отскок
                    let impulse = -(1 + bounce) * (player.vx * nx + player.vy * ny);
                    player.vx += nx * impulse;
                    player.vy += ny * impulse;
                }
            });

            // Лазеры
            hazards.forEach(h => {
                if (player.x + player.radius > h.x && player.x - player.radius < h.x + h.w &&
                    player.y + player.radius > h.y && player.y - player.radius < h.y + h.h) {
                    restartCurrentLevel();
                }
            });

            // Портал (Победа)
            let pdx = player.x - portal.x;
            let pdy = player.y - portal.y;
            if (Math.sqrt(pdx*pdx + pdy*pdy) < player.radius + portal.radius) {
                triggerWin();
                return;
            }

            render();
            requestAnimationFrame(updatePhysics);
        }

        function render() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Платформы
            platforms.forEach(p => {
                ctx.fillStyle = p.type === 'bouncy' ? '#f355da' : '#1e293b';
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Лазеры
            hazards.forEach(h => {
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(h.x, h.y, h.w, h.h);
            });

            // Портал
            ctx.fillStyle = 'rgba(0, 255, 135, 0.3)';
            ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#00ff87'; ctx.lineWidth = 3; ctx.stroke();

            // Линия прицеливания рогатки
            if (isDragging) {
                ctx.strokeStyle = varName = '#00f2fe';
                ctx.lineWidth = 4;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                // Показываем куда полетит (в противоположную сторону от оттяжки)
                let targetX = player.x + (dragStart.x - dragCurrent.x) * 0.5;
                let targetY = player.y + (dragStart.y - dragCurrent.y) * 0.5;
                ctx.lineTo(targetX, targetY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Шар
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
        }

        // --- НОВОЕ СЕНСОРНОЕ УПРАВЛЕНИЕ (РОГАТКА) ---
        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const tX = (touch.clientX - rect.left) * (WIDTH / rect.width);
            const tY = (touch.clientY - rect.top) * (HEIGHT / rect.height);

            // Проверяем, зажал ли игрок пальцем шарик
            let dist = Math.sqrt((tX - player.x)**2 + (tY - player.y)**2);
            if (dist < player.radius + 30) { // Даем небольшую погрешность под палец
                isDragging = true;
                player.vx = 0; player.vy = 0; // Останавливаем шар при захвате
                dragStart = { x: tX, y: tY };
                dragCurrent = { x: tX, y: tY };
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            dragCurrent.x = (touch.clientX - rect.left) * (WIDTH / rect.width);
            dragCurrent.y = (touch.clientY - rect.top) * (HEIGHT / rect.height);
        });

        canvas.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;

            // Считаем силу запуска
            let dx = dragStart.x - dragCurrent.x;
            let dy = dragStart.y - dragCurrent.y;

            // Запускаем шар в сторону натяжения (умножаем на адекватный коэффициент скорости)
            player.vx = dx * 0.12;
            player.vy = dy * 0.12;
        });

        function triggerWin() {
            gameActive = false; clearInterval(timerInterval);
            let finalTime = parseFloat(((Date.now() - startTime) / 1000).toFixed(1));
            let cfg = levelProgress[currentLevel];
            cfg.bestTime = cfg.bestTime ? Math.min(cfg.bestTime, finalTime) : finalTime;

            let medal = 'bronze'; let icon = '🥉'; let name = 'БРОНЗА';
            if(finalTime <= cfg.gold) { medal = 'gold'; icon = '🥇'; name = 'ЗОЛОТО'; }
            else if(finalTime <= cfg.silver) { medal = 'silver'; icon = '🥈'; name = 'СЕРЕБРО'; }
            cfg.medal = medal;

            document.getElementById('win-time-desc').innerText = `Время: ${finalTime} сек.`;
            document.getElementById('win-medal-icon').innerText = icon;
            document.getElementById('win-medal-name').innerText = name;
            document.getElementById('win-modal').style.display = 'flex';
        }

        function restartCurrentLevel() { startLevel(currentLevel); }
        function exitToMenu() {
            gameActive = false; clearInterval(timerInterval);
            document.getElementById('win-modal').style.display = 'none';
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            buildMenu();
        }

        window.onload = buildMenu;
    </script>
</body>
</html>
